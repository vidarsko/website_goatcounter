<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Siden ligger under en undermappe (…/website_goatcounter/), så robots.txt virker ikke her.
       Denne taggen er det som holder den ute av søkemotorer. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Besøksstatistikk</title>
  <script>try{var t=localStorage.getItem('theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Hopp til innholdet</a>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">B</span>
      <span class="brand-name">Besøksstatistikk</span>
    </div>
    <p class="updated" id="updated"></p>
    <button class="theme-toggle" type="button" aria-pressed="false" aria-label="Bytt til mørkt tema">
      <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <main id="main">
    <div class="page-head">
      <a class="back" id="back" href="#" hidden>← Alle sider</a>
      <h1 id="page-title">Alle sider</h1>
      <div class="seg" id="period-filter" role="radiogroup" aria-label="Periode"></div>
    </div>

    <p class="notice" id="notice" hidden></p>

    <!-- Oversikten: én rute per nettsted, hver lenker til detaljene (#<kode>). -->
    <section class="site-grid" id="overview" aria-label="Nettstedene"></section>

    <div class="detail" id="detail" hidden>
    <section class="kpis" id="kpis" aria-label="Nøkkeltall"></section>

    <section class="panel panel-wide" aria-labelledby="trend-title">
      <div class="panel-head">
        <h2 id="trend-title">Besøkende</h2>
        <p class="panel-sub" id="trend-sub"></p>
      </div>
      <div class="legend" id="trend-legend"></div>
      <div class="chart" id="trend-chart"></div>
      <details class="table-view">
        <summary>Vis som tabell</summary>
        <div class="table-scroll" id="trend-table"></div>
      </details>
    </section>

    <div class="grid-2">
      <section class="panel" aria-labelledby="pages-title">
        <div class="panel-head">
          <h2 id="pages-title">Mest besøkte sider</h2>
          <p class="panel-sub">Besøkende i perioden</p>
        </div>
        <ol class="bars" id="pages"></ol>
        <p class="hidden-note" id="pages-hidden"></p>
      </section>

      <section class="panel" aria-labelledby="refs-title">
        <div class="panel-head">
          <h2 id="refs-title">Hvor besøkende kommer fra</h2>
          <p class="panel-sub">Bare domenet vises, aldri hele adressen</p>
        </div>
        <ol class="bars" id="refs"></ol>
        <p class="hidden-note" id="refs-hidden"></p>
      </section>
    </div>
    </div>
  </main>

  <div class="tooltip" id="tooltip" role="status" hidden></div>

  <script src="js/theme.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
